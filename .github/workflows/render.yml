name: render

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Studio job id
        required: true
        type: string

concurrency:
  group: studio-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve job capability
        id: job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          capability=$(curl -sSf \
            "$SUPABASE_URL/rest/v1/st_jobs?id=eq.$JOB_ID&select=capability" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            | jq -r '.[0].capability // ""')
          echo "capability=$capability" >> "$GITHUB_OUTPUT"
          echo "Job capability: $capability"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache Kokoro models
        if: steps.job.outputs.capability == 'voice-kokoro'
        uses: actions/cache@v4
        with:
          path: runner/models
          key: kokoro-models-v1

      - name: Install runner dependencies
        run: npm install --no-audit --no-fund --prefix runner

      - name: Install Kokoro
        if: steps.job.outputs.capability == 'voice-kokoro'
        run: pip install --quiet kokoro-onnx soundfile

      - name: Fetch Kokoro models
        if: steps.job.outputs.capability == 'voice-kokoro'
        run: bash runner/scripts/fetch-models.sh

      - name: Install XTTS
        if: steps.job.outputs.capability == 'voice-xtts'
        run: pip install --quiet TTS

      - name: Install PPT Master dependencies
        if: steps.job.outputs.capability == 'deck-pptmaster'
        run: pip install --quiet PyYAML python-pptx XlsxWriter skia-pathops uharfbuzz

      - name: Install OpenMontage dependencies
        if: steps.job.outputs.capability == 'film-documentary'
        run: pip install --quiet pyyaml "pydantic>=2" jsonschema python-dotenv Pillow numpy requests

      - name: Cache Whisper models
        if: contains(fromJSON('["film-talking-head","film-clip-factory","film-podcast","film-dub","film-screen-demo","film-hybrid"]'), steps.job.outputs.capability)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Install source-edit dependencies
        if: contains(fromJSON('["film-talking-head","film-clip-factory","film-podcast","film-dub","film-screen-demo","film-hybrid"]'), steps.job.outputs.capability)
        run: pip install --quiet faster-whisper kokoro-onnx soundfile

      - name: Install XTTS (optional)
        if: steps.job.outputs.capability == 'film-dub'
        continue-on-error: true
        run: pip install --quiet TTS

      - name: Run job
        env:
          JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STUDIO_BASE_URL: ${{ secrets.STUDIO_BASE_URL }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          KOKORO_MODEL: runner/models/kokoro-v1.0.onnx
          KOKORO_VOICES: runner/models/voices-v1.0.bin
        run: node runner/entry.mjs
